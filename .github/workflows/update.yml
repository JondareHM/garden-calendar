name: Update garden calendar

on:
  push:
    paths:
      - garden.yaml
      - initial_state.yaml
      - apply_plan_overrides.py
      - generate_calendar.py
      - generate_with_initial_state.py
      - add_year_separators.py
      - highlight_current_events.py
      - test_generate_calendar.py
      - requirements.txt
      - .github/workflows/update.yml
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest -v

      - name: Apply plan overrides
        run: python apply_plan_overrides.py

      - name: Generate calendar and overview
        run: |
          # Both generated artifacts use the current garden state before 2027.
          python generate_with_initial_state.py
          python add_year_separators.py
          python highlight_current_events.py

      - name: Commit calendar, overview and source data if changed
        run: |
          if git diff --quiet -- garden.yaml initial_state.yaml calendar/have.ics index.html; then
            echo "No calendar, overview or source-data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden.yaml initial_state.yaml calendar/have.ics index.html
          git commit -m "Update garden calendar and overview"
          git push
